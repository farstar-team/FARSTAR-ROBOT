<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1819"><title>Farstar · مینی‌اپ</title>
  <link rel="icon" href="/static/mark.svg"><link rel="stylesheet" href="/static/mini.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/static/mini.js" type="module"></script>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div id="gate" class="gate"><div class="logo big">✦</div><span class="eyebrow">FARSTAR CONNECT</span><h1>اتصال، به سبک تو.</h1><p id="gate-copy">در حال ورود امن با تلگرام…</p><div id="gate-actions"></div></div>
  <div id="mini-shell" hidden>
    <header class="app-header"><a href="#home" class="wordmark"><span class="logo" id="brand-logo">✦</span><span><b id="brand-name">farstar</b><small id="role-label">همراه اتصال تو</small></span></a><div class="header-actions"><button class="icon-btn" data-action="refresh" aria-label="بروزرسانی">↻</button><button id="profile-button" class="avatar" data-action="profile" aria-label="حساب من">F</button></div></header>
    <div id="demo-note" class="demo-note" hidden>محیط نمایشی · هیچ پرداخت یا پیام واقعی انجام نمی‌شود</div>
    <main id="screen" aria-live="polite"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="منوی اصلی"></nav>
  </div>
  <dialog id="sheet"><div class="sheet-handle"></div><div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" data-action="close" aria-label="بستن">×</button></div><div id="sheet-content"></div></dialog>
  <div id="mini-toast" role="status" hidden></div>
</body></html>
