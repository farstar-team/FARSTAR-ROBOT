[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "farstar-vpn"
version = "1.2.1"
description = "Persian Telegram VPN storefront for Sanaei 3x-ui 3.11"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.31,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "cryptography>=44",
  "qrcode[pil]>=8,<9", "tzdata>=2025.1", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11", "zxing-cpp>=2.3,<4"]
guides = ["arabic-reshaper>=3,<4", "python-bidi>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["farstar*"]

[tool.setuptools.package-data]
farstar = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
