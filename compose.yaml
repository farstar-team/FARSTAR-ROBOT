services:
  farstar:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /app/data/farstar.db
      DEMO: "false"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - farstar-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  farstar-data:
